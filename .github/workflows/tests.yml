name: Node tests
on:
  pull_request:
  push:
    branches: [main, 'codex/**', 'feature/**']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --check lib/deviceTypes.js
      - run: node --check lib/deviceStore.js
      - run: node --check lib/domoticz.js
      - run: node --check lib/matterBridge.js
